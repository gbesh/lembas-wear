<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lembas watch art</title>
<style>
/* The Lembas watch face's pictures: flat, colourful little scenes in the four looks, one per
   season, drawn for a round 450px face, and the pieces that move on them (rendered separately so
   the watch can animate them). ?part= picks one; ?outline=1 draws a scene as thin grey lines for
   the always-on display. Everything is transparent where nothing is drawn. */
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block}
.outline *{fill:none!important;stroke:#8C8C8C!important;stroke-width:1.6px!important;opacity:1!important}
.outline .no{display:none}
</style>
</head>
<body>
<script>
'use strict';
var q = new URLSearchParams(location.search);
var PART = q.get('part') || 'shire-summer';
var W = +(q.get('w') || 450), H = +(q.get('h') || 450);
var OUTLINE = q.get('outline') === '1';
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function f(n) { return Math.round(n * 10) / 10; }
function wave(base, amp, fr, p) { var d = 'M-5,460'; for (var x = -5; x <= 455; x += 6) d += ' L' + x + ',' + f(base + Math.sin(x * fr + p) * amp + Math.sin(x * fr * 2.3 + p * 1.7) * amp * .35); return d + ' L455,460Z'; }
function peaks(base, pts) { var d = 'M-5,460 L-5,' + base; pts.forEach(function (p) { d += ' L' + p[0] + ',' + p[1]; }); return d + ' L455,' + base + ' L455,460Z'; }
var P = {};

// ------------------------------------------------------------------ Shire Morning
var SHIRE = {
  spring: { sky: '#E6E7D1', sun: '#FFD86A', h1: '#C3D99A', h2: '#93BE6C', h3: '#67A04E', h4: '#507F3E', door: '#2F6B42', dots: ['#F3A6B8', '#FFFFFF', '#D7C38A'] },
  summer: { sky: '#E7DFC8', sun: '#FFCF5A', h1: '#B7D08F', h2: '#86B263', h3: '#5E9147', h4: '#4C7C3B', door: '#2F6B42', dots: ['#C8573A', '#C8573A', '#D7C38A'] },
  autumn: { sky: '#E6D9C2', sun: '#FFB45A', h1: '#D9B76E', h2: '#C08C45', h3: '#8E7A3A', h4: '#6E5A2E', door: '#2F6B42', dots: ['#C8573A', '#E0883A', '#B5452A'] },
  winter: { sky: '#E3E9EE', sun: '#FFE7A6', h1: '#F6F8FA', h2: '#E4EBF0', h3: '#CFD9E0', h4: '#B7C4CC', door: '#2F6B42', dots: ['#FFFFFF', '#FFFFFF', '#C8573A'] },
};
function shire(season) {
  var c = SHIRE[season], s = '';
  s += '<rect class="no" width="450" height="450" fill="' + c.sky + '"/>';
  s += '<circle class="no" cx="96" cy="300" r="120" fill="' + c.sun + '" opacity=".22"/><circle cx="96" cy="300" r="74" fill="' + c.sun + '"/>';
  s += '<path d="' + wave(300, 10, 0.018, 1) + '" fill="' + c.h1 + '"/>';
  s += '<path d="' + wave(330, 12, 0.022, 3) + '" fill="' + c.h2 + '"/>';
  s += '<path d="M140,460 C170,360 260,330 340,334 C400,338 440,360 460,380 L460,460Z" fill="' + c.h3 + '"/>';
  // the round green door, with its brass knob, and a round window
  s += '<circle cx="300" cy="392" r="30" fill="#CEBA93"/><circle cx="300" cy="392" r="24" fill="' + c.door + '"/><circle class="no" cx="300" cy="392" r="3.5" fill="#FFCF5A"/>';
  s += '<circle cx="246" cy="384" r="11" fill="#CEBA93"/><circle class="no" cx="246" cy="384" r="7.5" fill="#FFF3C9"/>';
  // the chimney the smoke rises from
  s += '<rect x="352" y="318" width="12" height="24" rx="2" fill="#8A6A48"/>';
  s += '<path d="M-10,460 C40,400 120,388 200,410 L200,460Z" fill="' + c.h4 + '"/>';
  var r = rng(4), d = c.dots;
  for (var i = 0; i < (season === 'summer' ? 3 : 16); i++) {
    var x = season === 'summer' ? [70, 96, 356][i] : 20 + r() * 420, y = season === 'summer' ? [420, 430, 430][i] : 350 + r() * 90;
    s += '<circle class="no" cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(2.5 + r() * 1.5) + '" fill="' + d[i % 3] + '"/>';
  }
  if (season === 'winter') s += '<path class="no" d="M290,362 q10,-6 20,0 q6,4 12,0" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>';
  return s;
}

// ------------------------------------------------------------------ Red Book (by the fire; the flames are separate, they move)
function redbook() {
  var s = '<rect class="no" width="450" height="450" fill="#6A1D16"/>';
  s += '<circle cx="225" cy="470" r="230" fill="#8A2A1A"/><circle class="no" cx="225" cy="470" r="170" fill="#B23A1E"/>';
  return s;
}
P['logs'] = function () { return '<path d="M150,440 l150,-40 M150,400 l150,40" stroke="#3A120C" stroke-width="12" stroke-linecap="round"/>'; };
P['flame-outer'] = function () { return '<path d="M60,4 C120,74 135,114 105,174 C90,204 30,204 15,174 C-15,114 5,74 60,4Z" transform="translate(0,0)" fill="#E8612A"/>'; };   // 120x200
P['flame-mid'] = function () { return '<path d="M42,2 C76,42 82,70 64,110 C54,130 24,130 16,110 C2,74 14,40 42,2Z" fill="#F7A23B"/>'; };  // 84x124
P['flame-inner'] = function () { return '<path d="M20,2 C38,24 40,40 30,60 C24,70 12,70 8,60 C2,42 8,28 20,2Z" fill="#FFE07A"/>'; };     // 40x70

// ------------------------------------------------------------------ Starlit Night (the moon is separate: tonight's real phase)
function starlit(season) {
  var s = '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1233"/><stop offset="1" stop-color="#3B2F6E"/></linearGradient></defs>';
  s += '<rect class="no" width="450" height="450" fill="url(#g)"/>';
  var r = rng(9);
  for (var i = 0; i < 60; i++) s += '<circle class="no" cx="' + f(r() * 450) + '" cy="' + f(r() * 250) + '" r="' + f(.6 + r() * 1.2) + '" fill="#ECE6D8" opacity="' + f(.3 + r() * .6) + '"/>';
  var far = [[40, 280], [90, 300], [150, 250], [210, 296], [260, 270], [330, 230], [390, 280], [440, 262]];
  s += '<path d="' + peaks(330, far) + '" fill="#4B3F8A"/>';
  if (season === 'winter') far.forEach(function (p, k) {   // snow on the far peaks
    if (k % 2 === 0 && p[1] < 290) s += '<path class="no" d="M' + (p[0] - 14) + ',' + (p[1] + 18) + ' L' + p[0] + ',' + p[1] + ' L' + (p[0] + 14) + ',' + (p[1] + 18) + ' L' + (p[0] + 5) + ',' + (p[1] + 13) + ' L' + p[0] + ',' + (p[1] + 19) + ' L' + (p[0] - 6) + ',' + (p[1] + 13) + 'Z" fill="#E9E6F6"/>';
  });
  s += '<path d="' + peaks(360, [[30, 330], [110, 300], [170, 334], [240, 296], [300, 330], [380, 306], [455, 340]]) + '" fill="#2B2560"/>';
  s += '<path d="' + peaks(396, [[60, 380], [140, 356], [220, 384], [300, 362], [380, 388], [455, 370]]) + '" fill="' + (season === 'winter' ? '#2A2A55' : '#15123A') + '"/>';
  // a little cabin with a lit window by the lake shore
  s += '<path d="M318,392 L340,374 L362,392 L362,410 L318,410Z" fill="#0E0C28"/><rect class="no" x="334" y="394" width="10" height="8" fill="#FFC867"/>';
  return s;
}
function moon(phase, big) {   // northern view, lit on the right while waxing
  var cx = big / 2, cy = big / 2, rr = big / 2 - 2;
  var tw = rr * Math.cos(2 * Math.PI * phase), aw = Math.max(Math.abs(tw), .4);
  var d = 'M' + cx + ',' + (cy - rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + cx + ',' + (cy + rr) + ' A' + f(aw) + ',' + rr + ' 0 0 ' + (tw >= 0 ? 0 : 1) + ' ' + cx + ',' + (cy - rr) + ' Z';
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="#2A2C5E"/><path d="' + d + '" fill="#DAC696"' + (phase > .5 ? ' transform="translate(' + big + ',0) scale(-1,1)"' : '') + '/>';
}
for (var m = 0; m < 8; m++) (function (m) { P['moon' + m] = function () { return moon(m / 8 + .0001, 64); }; })(m);
P['moonglow'] = function () { return '<defs><radialGradient id="h"><stop offset="0" stop-color="#DAC696" stop-opacity=".35"/><stop offset="1" stop-color="#DAC696" stop-opacity="0"/></radialGradient></defs><circle cx="70" cy="70" r="70" fill="url(#h)"/>'; };  // 140
P['shooting'] = function () { return '<defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#FFF" stop-opacity=".95"/></linearGradient></defs><path d="M2,2 L96,30" stroke="url(#s)" stroke-width="2.4" stroke-linecap="round"/>'; };  // 100x34

// ------------------------------------------------------------------ Elven Silver
var ELVEN = {
  spring: ['#9CCFB4', '#D7EBC8', '#F2D6E0', '#BFE3D0'],
  summer: ['#5FA9AD', '#8FC4C6', '#B9DADB', '#D8E9D0'],
  autumn: ['#D9A441', '#D0BD93', '#C7783A', '#DFD4B2'],
  winter: ['#C9D8DC', '#E6F0F2', '#A9BEC4', '#FFFFFF'],
};
function elven(season) {
  var s = '<defs><linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04080A"/><stop offset="1" stop-color="#0B2A31"/></linearGradient></defs>';
  s += '<rect class="no" width="450" height="450" fill="url(#e)"/>';
  var r = rng(12);
  for (var i = 0; i < 40; i++) s += '<circle class="no" cx="' + f(r() * 450) + '" cy="' + f(r() * 200) + '" r="' + f(.5 + r()) + '" fill="#E6F4F6" opacity="' + f(.3 + r() * .5) + '"/>';
  var knoll = season === 'winter' ? ['#3E6A72', '#6F9DA3', '#B9D3D6'] : ['#0F4A52', '#1B7076', '#3FA0A2'];
  s += '<ellipse cx="225" cy="470" rx="320" ry="140" fill="' + knoll[0] + '"/><ellipse cx="225" cy="480" rx="240" ry="96" fill="' + knoll[1] + '"/><ellipse class="no" cx="225" cy="492" rx="150" ry="62" fill="' + knoll[2] + '"/>';
  // two slender silver trees at the edges, trunks curving in, soft round crowns of leaves
  var rl = rng(77), col = ELVEN[season];
  [-1, 1].forEach(function (side) {
    var bx = 225 + side * 150, tx = 225 + side * 100;   // the trunks stand inside the complications
    s += '<path d="M' + (bx - side * 10) + ',470 C' + (bx - side * 4) + ',360 ' + (tx + side * 22) + ',250 ' + tx + ',150 C' + (tx + side * 10) + ',250 ' + (bx + side * 12) + ',360 ' + (bx + side * 14) + ',470Z" fill="#C9D8DC"/>';
    s += '<path d="M' + (tx + side * 10) + ',300 q' + side * 18 + ',-8 ' + side * 30 + ',-34" stroke="#C9D8DC" stroke-width="5" fill="none" stroke-linecap="round"/>';
    var leaves = season === 'winter' ? 8 : 14;
    for (var k = 0; k < 14; k++) { var a = rl() * Math.PI * 2, d = Math.sqrt(rl()) * 46, rr = 14 + rl() * 10; if (k < leaves) s += '<circle class="' + (k % 3 ? 'no' : '') + '" cx="' + f(tx + side * 44 + Math.cos(a) * d * 1.05) + '" cy="' + f(128 + Math.sin(a) * d * .8) + '" r="' + f(rr) + '" fill="' + col[k % 4] + '" opacity=".85"/>'; }
    for (k = 0; k < 5; k++) { a = rl() * Math.PI * 2; d = Math.sqrt(rl()) * 30; rr = 9 + rl() * 6; if (season !== 'winter' || k < 2) s += '<circle class="no" cx="' + f(tx + side * 40 + Math.cos(a) * d) + '" cy="' + f(262 + Math.sin(a) * d * .7) + '" r="' + f(rr) + '" fill="' + col[k % 2 ? 3 : 1] + '" opacity=".8"/>'; }
  });
  return s;
}
P['elven-star'] = function () {  // 80px: Eärendil's star, pulsing
  return '<defs><radialGradient id="h"><stop offset="0" stop-color="#BFE3EC" stop-opacity=".4"/><stop offset="1" stop-color="#BFE3EC" stop-opacity="0"/></radialGradient></defs><circle cx="40" cy="40" r="40" fill="url(#h)"/>' +
    '<path d="M40,16 l5,19 19,5 -19,5 -5,19 -5,-19 -19,-5 19,-5z" fill="#F2FAFC"/>';
};
P['sunglow'] = function () { return '<defs><radialGradient id="h"><stop offset=".5" stop-color="#FFE7A0" stop-opacity=".5"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient></defs><circle cx="110" cy="110" r="110" fill="url(#h)"/>'; };  // 220
P['dawnglow'] = function () {   // sunrise and sunset: a pink and amber wash from the horizon
  return '<defs><linearGradient id="d" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A5C" stop-opacity=".55"/><stop offset=".45" stop-color="#F2789A" stop-opacity=".28"/><stop offset="1" stop-color="#F2789A" stop-opacity="0"/></linearGradient></defs><rect width="450" height="450" fill="url(#d)"/>';
};
P['fox'] = function () {   // 60x34: a fox trotting over the Shire's hills, now and then
  return '<g fill="#D9733A"><path d="M8,18 C14,10 30,8 42,12 L50,6 L52,14 C56,16 58,20 54,22 L44,22 C40,26 30,26 22,24 C16,28 8,28 4,24 C10,24 12,22 8,18Z"/>' +
    '<path d="M14,22 l-2,10 M22,24 l1,9 M38,23 l-1,9 M45,22 l2,9" stroke="#8A3E1A" stroke-width="2.4" stroke-linecap="round"/></g>' +
    '<path d="M4,24 C0,20 2,14 8,18" fill="#F4EFE4"/>';
};
P['puff'] = function () { return '<circle cx="12" cy="12" r="11" fill="#FFFFFF"/>'; };   // 24
P['cloud'] = function () { return '<g fill="#FFFFFF"><rect x="10" y="30" width="130" height="26" rx="13"/><circle cx="52" cy="32" r="22"/><circle cx="88" cy="24" r="26"/><circle cx="118" cy="38" r="16"/></g>'; };  // 150x60
P['fog'] = function () { return '<defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6EEF0" stop-opacity="0"/><stop offset=".5" stop-color="#E6EEF0" stop-opacity=".42"/><stop offset="1" stop-color="#E6EEF0" stop-opacity="0"/></linearGradient></defs><rect width="600" height="120" fill="url(#f)"/>'; };  // 600x120
// rain and snow, as short loops of frames (the watch plays them like a little film)
function rainFrame(k, n) {
  var r = rng(31), s = '';
  for (var i = 0; i < 46; i++) { var x = r() * 470, y0 = r() * 450, y = (y0 + k / n * 450) % 450, len = 14 + r() * 10; s += '<path d="M' + f(x) + ',' + f(y) + ' l-4,' + f(len) + '" stroke="#DCE6EE" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>'; }
  return s;
}
function snowFrame(k, n) {
  var r = rng(41), s = '';
  for (var i = 0; i < 40; i++) { var x = r() * 450, y0 = r() * 450, sp = .5 + r() * .5, y = (y0 + k / n * 450 * sp * 2) % 450, ph = r() * 6; s += '<circle cx="' + f(x + 6 * Math.sin(ph + k / n * 6.283)) + '" cy="' + f(y) + '" r="' + f(1.8 + r() * 2) + '" fill="#FFFFFF" opacity=".9"/>'; }
  return s;
}
for (var k = 0; k < 8; k++) (function (k) { P['rain' + k] = function () { return rainFrame(k, 8); }; P['snow' + k] = function () { return snowFrame(k, 8); }; })(k);

['spring', 'summer', 'autumn', 'winter'].forEach(function (season) {
  P['shire-' + season] = function () { return shire(season); };
  P['starlit-' + season] = function () { return starlit(season); };
  P['elven-' + season] = function () { return elven(season); };
});
P['redbook'] = redbook;
P['redbook-outline-fire'] = function () { return '<path d="M225,250 C285,320 300,360 270,420 C255,450 195,450 180,420 C150,360 170,320 225,250Z"/>'; };

var body = P[PART] ? P[PART]() : '';
if (OUTLINE && PART === 'redbook') body += P['redbook-outline-fire']() + P['logs']();
document.body.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"' + (OUTLINE ? ' class="outline"' : '') + '>' +
  (W === 450 && H === 450 ? '<defs><clipPath id="round"><circle cx="225" cy="225" r="225"/></clipPath></defs><g clip-path="url(#round)">' + body + '</g>' : body) + '</svg>';
</script>
</body>
</html>
