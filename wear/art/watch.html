<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lembas watch art</title>
<style>
/* Backgrounds and sprites for the round 450px Lembas watch face. Each ?part= renders one layer
   (transparent where nothing is drawn). Backgrounds are deep tonal colour or black: the four
   Lembas palettes as light, not as illustration, and kind to an OLED screen. */
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block}
</style>
</head>
<body>
<script>
'use strict';
var q = new URLSearchParams(location.search);
var PART = q.get('part') || 'starlit-back';
var W = +(q.get('w') || 450), H = +(q.get('h') || 450);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function f(n) { return Math.round(n * 10) / 10; }
var P = {};

function glow(id, cx, cy, r, color, op) {
  return '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '" gradientUnits="userSpaceOnUse">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity="' + op + '"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></radialGradient>';
}
function stars(seed, n, maxOp) {
  var r = rng(seed), s = '';
  for (var i = 0, k = 0; k < n && i < 5000; i++) {
    var x = r() * 450, y = r() * 450, dx = x - 225, dy = y - 225;
    if (dx * dx + dy * dy > 185 * 185 || (Math.abs(dx) < 120 && y > 60 && y < 380)) continue;   // keep clear of the time
    k++;
    s += '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(.5 + Math.pow(r(), 3) * .9) + '" fill="#F4F1E8" opacity="' + f(.12 + r() * maxOp) + '"/>';
  }
  return s;
}
// a low, soft line of hills across the bottom: the only scenery, as a silhouette
function hills(fill, op) {
  return '<path d="M0,392 C80,370 150,366 225,378 C300,390 370,372 450,360 V450 H0 Z" fill="' + fill + '" opacity="' + op + '"/>';
}

// ------------------------------------------------------------------ backgrounds
P['shire-back'] = function () {   // deep green, morning light from above
  return '<defs>' + glow('a', 225, 30, 320, '#E8C766', .22) + glow('b', 225, 470, 260, '#7EA35C', .28) + '</defs>' +
    '<rect width="450" height="450" fill="#09120B"/><rect width="450" height="450" fill="url(#b)"/><rect width="450" height="450" fill="url(#a)"/>';
};
P['redbook-back'] = function () {  // oxblood, lit like a page by the fire
  return '<defs>' + glow('a', 225, 40, 330, '#B4402E', .30) + glow('b', 225, 460, 260, '#E8C690', .10) + '</defs>' +
    '<rect width="450" height="450" fill="#0F0605"/><rect width="450" height="450" fill="url(#a)"/><rect width="450" height="450" fill="url(#b)"/>';
};
P['starlit-back'] = function () {  // black, a little blue at the zenith
  return '<defs>' + glow('a', 225, 0, 300, '#22346B', .55) + '</defs>' +
    '<rect width="450" height="450" fill="#000"/><rect width="450" height="450" fill="url(#a)"/>' + stars(1954, 46, .45);
};
P['elven-back'] = function () {    // black, a breath of silver
  return '<defs>' + glow('a', 225, 225, 240, '#9FB8C4', .10) + '</defs>' +
    '<rect width="450" height="450" fill="#000"/><rect width="450" height="450" fill="url(#a)"/>' + stars(1955, 30, .35);
};

// ------------------------------------------------------------------ the 24-hour sun ring
// Noon at the top, midnight at the bottom, sunrise on the left and sunset on the right.
// Drawn white; the face tints it for each look.
P['ticks'] = function () {
  var s = '';
  for (var h = 0; h < 24; h++) {
    var a = (h / 24 * 360 + 180) * Math.PI / 180, major = h % 6 === 0;
    var r1 = major ? 188 : 195, r2 = 202;
    s += '<path d="M' + f(225 + r1 * Math.sin(a)) + ',' + f(225 - r1 * Math.cos(a)) + ' L' + f(225 + r2 * Math.sin(a)) + ',' + f(225 - r2 * Math.cos(a)) +
      '" stroke="#FFF" stroke-width="' + (major ? 3 : 1.6) + '" stroke-linecap="round" opacity="' + (major ? 1 : .6) + '"/>';
  }
  return s;
};
P['arc-day'] = function () {     // the daylight half of the ring (6am to 6pm, over the top)
  return '<path d="M16,225 A209,209 0 0 1 434,225" fill="none" stroke="#FFF" stroke-width="2.6" stroke-linecap="round"/>';
};
P['arc-night'] = function () {
  return '<path d="M16,225 A209,209 0 0 0 434,225" fill="none" stroke="#FFF" stroke-width="1.4" stroke-linecap="round"/>';
};
P['ticks-major'] = function () {   // the always-on display shows only 6, 12, 18 and midnight
  var s = '';
  for (var h = 0; h < 24; h += 6) {
    var a = (h / 24 * 360 + 180) * Math.PI / 180;
    s += '<path d="M' + f(225 + 190 * Math.sin(a)) + ',' + f(225 - 190 * Math.cos(a)) + ' L' + f(225 + 202 * Math.sin(a)) + ',' + f(225 - 202 * Math.cos(a)) + '" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>';
  }
  return s;
};
P['sun'] = function () {  // 40px: the sun on the ring
  return '<defs><radialGradient id="g"><stop offset="0" stop-color="#FFF4C8" stop-opacity=".9"/><stop offset=".4" stop-color="#FFD978" stop-opacity=".45"/><stop offset="1" stop-color="#FFD978" stop-opacity="0"/></radialGradient></defs>' +
    '<circle cx="20" cy="20" r="20" fill="url(#g)"/><circle cx="20" cy="20" r="7.5" fill="#FFF3C4"/>';
};
P['moonhalo'] = function () {
  return '<defs><radialGradient id="g"><stop offset="0" stop-color="#DCE4F5" stop-opacity=".35"/><stop offset="1" stop-color="#DCE4F5" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="20" fill="url(#g)"/>';
};
function moon(phase) {  // 26px, northern-hemisphere view (lit on the right while waxing)
  var cx = 13, cy = 13, rr = 12;
  var tw = rr * Math.cos(2 * Math.PI * phase), aw = Math.max(Math.abs(tw), .4);
  var d = 'M' + cx + ',' + (cy - rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + cx + ',' + (cy + rr) +
    ' A' + f(aw) + ',' + rr + ' 0 0 ' + (tw >= 0 ? 0 : 1) + ' ' + cx + ',' + (cy - rr) + ' Z';
  return '<circle cx="13" cy="13" r="12" fill="#1A1F2C" stroke="#3A4256" stroke-width=".8"/><path d="' + d + '" fill="#F2EEE2"' + (phase > .5 ? ' transform="translate(26,0) scale(-1,1)"' : '') + '/>';
}
for (var m = 0; m < 8; m++) (function (m) { P['moon' + m] = function () { return moon(m / 8 + .0001); }; })(m);

document.body.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + (P[PART] ? P[PART]() : '') + '</svg>';
</script>
</body>
</html>
