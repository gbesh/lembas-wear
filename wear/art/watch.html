<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lembas watch art</title>
<style>
/* The Lembas watch face's pictures: flat, colourful little scenes in the four looks, one per
   season, drawn for a round 450px face, and the pieces that move on them (rendered separately so
   the watch can animate them). ?part= picks one; ?outline=1 draws a scene as thin grey lines for
   the always-on display. Everything is transparent where nothing is drawn. */
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block}
.outline *{fill:none!important;stroke:#8C8C8C!important;stroke-width:1.6px!important;opacity:1!important}
.outline .no{display:none}
</style>
</head>
<body>
<script>
'use strict';
var q = new URLSearchParams(location.search);
var PART = q.get('part') || 'shire-summer';
var W = +(q.get('w') || 450), H = +(q.get('h') || 450);
var OUTLINE = q.get('outline') === '1';
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function f(n) { return Math.round(n * 10) / 10; }
function wave(base, amp, fr, p) { var d = 'M-5,460'; for (var x = -5; x <= 455; x += 6) d += ' L' + x + ',' + f(base + Math.sin(x * fr + p) * amp + Math.sin(x * fr * 2.3 + p * 1.7) * amp * .35); return d + ' L455,460Z'; }
function peaks(base, pts) { var d = 'M-5,460 L-5,' + base; pts.forEach(function (p) { d += ' L' + p[0] + ',' + p[1]; }); return d + ' L455,' + base + ' L455,460Z'; }
var P = {};

// ------------------------------------------------------------------ Shire Morning
var SHIRE = {
  spring: { sky: '#E6E7D1', sun: '#FFD86A', h1: '#C3D99A', h2: '#93BE6C', h3: '#67A04E', h4: '#507F3E', door: '#2F6B42', dots: ['#F3A6B8', '#FFFFFF', '#D7C38A'] },
  summer: { sky: '#E7DFC8', sun: '#FFCF5A', h1: '#B7D08F', h2: '#86B263', h3: '#5E9147', h4: '#4C7C3B', door: '#2F6B42', dots: ['#C8573A', '#C8573A', '#D7C38A'] },
  autumn: { sky: '#E6D9C2', sun: '#FFB45A', h1: '#D9B76E', h2: '#C08C45', h3: '#8E7A3A', h4: '#6E5A2E', door: '#2F6B42', dots: ['#C8573A', '#E0883A', '#B5452A'] },
  winter: { sky: '#E3E9EE', sun: '#FFE7A6', h1: '#F6F8FA', h2: '#E4EBF0', h3: '#CFD9E0', h4: '#B7C4CC', door: '#2F6B42', dots: ['#FFFFFF', '#FFFFFF', '#C8573A'] },
};
function hex(c) { return [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }); }
function mix(a, b, t) { var A = hex(a), B = hex(b); return '#' + A.map(function (v, i) { return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0'); }).join(''); }
var gid = 0, DEFS = '';
function vg(top, bottom) { var id = 'v' + (gid++); DEFS += '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + top + '"/><stop offset="1" stop-color="' + bottom + '"/></linearGradient>'; return 'url(#' + id + ')'; }
function rg(cx, cy, r, color, o) { var id = 'r' + (gid++); DEFS += '<radialGradient id="' + id + '" gradientUnits="userSpaceOnUse" cx="' + cx + '" cy="' + cy + '" r="' + r + '"><stop offset="0" stop-color="' + color + '" stop-opacity="' + o + '"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></radialGradient>'; return 'url(#' + id + ')'; }

function shire(season) {

  var rim = rg(96, 300, 420, '#FFFBEA', .8);
  var far = wave(286, 7, 0.026, 5);
  s += '<path class="no" d="' + far + '" fill="' + vg(mix(c.h1, '#BFE0E0', .5), mix(c.h1, '#BFE0E0', .3)) + '"/>';
  s += '<path d="' + wave(300, 10, 0.018, 1) + '" fill="' + vg(mix(c.h1, '#FFFFFF', .15), c.h1) + '"/><path class="no" d="' + wave(300, 10, 0.018, 1) + '" fill="none" stroke="' + rim + '" stroke-width="1.6"/>';
  s += '<path d="' + wave(330, 12, 0.022, 3) + '" fill="' + vg(mix(c.h2, '#FFFFFF', .1), mix(c.h2, c.h3, .5)) + '"/><path class="no" d="' + wave(330, 12, 0.022, 3) + '" fill="none" stroke="' + rim + '" stroke-width="1.6"/>';

  // the round green door in its stone ring, with a brass knob, a round window and a lantern

  s += '<circle cx="246" cy="384" r="11" fill="#CEBA93"/><circle class="no" cx="246" cy="384" r="7.5" fill="#FFF3C9"/>';
  s += '<circle class="no" cx="342" cy="372" r="16" fill="' + rg(342, 372, 16, '#FFE6A8', .7) + '"/><rect class="no" x="338" y="368" width="8" height="9" rx="1.5" fill="#FFE2A0" stroke="#4A3A28" stroke-width="1"/>';
  // the chimney the smoke rises from
  s += '<rect x="352" y="318" width="12" height="24" rx="2" fill="' + vg('#9A7A55', '#6A5038') + '"/>';
  // a little fence along the hill
  var fence = '<path d="M372,402 L440,390 M372,410 L440,398" stroke="#8C6F4C" stroke-width="2"/>';
  for (var k = 0; k <= 5; k++) { var fx = 372 + k * 13.6, fy = 418 - k * 2.4; fence += '<path d="M' + f(fx - 1.6) + ',' + f(fy) + ' V' + f(fy - 20) + ' l1.6,-3 l1.6,3 V' + f(fy) + 'Z" fill="#9A7B55"/>'; }
  s += '<g class="no">' + fence + '</g>';
  var front = 'M-10,460 C40,400 120,388 200,410 L200,460Z';
  s += '<path d="' + front + '" fill="' + vg(mix(c.h4, '#FFFFFF', .08), mix(c.h4, '#1E3A22', .3)) + '"/>';
  var r = rng(4), d = c.dots;

  }

  return s + grain(.9);
}

// ------------------------------------------------------------------ Red Book (by the fire; the flames are separate, they move)
function redbook() {
  var s = '<rect class="no" width="450" height="450" fill="' + vg('#3A100C', '#6A1D16') + '"/>';
  // the hearth's stone arch around the fire
  var st = '';
  for (var k = 0; k < 11; k++) { var a0 = Math.PI + k / 11 * Math.PI, a1 = a0 + Math.PI / 11 - .04, R = 210, R2 = 178;
    st += '<path d="M' + f(225 + Math.cos(a0) * R2) + ',' + f(470 + Math.sin(a0) * R2) + ' L' + f(225 + Math.cos(a0) * R) + ',' + f(470 + Math.sin(a0) * R) + ' A' + R + ',' + R + ' 0 0 1 ' + f(225 + Math.cos(a1) * R) + ',' + f(470 + Math.sin(a1) * R) + ' L' + f(225 + Math.cos(a1) * R2) + ',' + f(470 + Math.sin(a1) * R2) + ' A' + R2 + ',' + R2 + ' 0 0 0 ' + f(225 + Math.cos(a0) * R2) + ',' + f(470 + Math.sin(a0) * R2) + 'Z" fill="' + (k % 2 ? '#5A2A1C' : '#4A2216') + '"/>'; }
  s += st;
  s += '<circle cx="225" cy="470" r="178" fill="' + vg('#7A2A18', '#2A0C08') + '"/>';
  s += '<circle class="no" cx="225" cy="470" r="178" fill="' + rg(225, 430, 190, '#FF9A4A', .55) + '"/>';
  s += '<circle class="no" cx="225" cy="470" r="230" fill="' + rg(225, 420, 300, '#FFB25B', .16) + '"/>';
  return s + grain(1);
}
P['logs'] = function () { return '<path d="M150,440 l150,-40 M150,400 l150,40" stroke="#3A120C" stroke-width="13" stroke-linecap="round"/><path d="M150,438 l150,-40 M150,398 l150,40" stroke="#7A3A1E" stroke-width="4" stroke-linecap="round" opacity=".7"/><ellipse cx="225" cy="432" rx="70" ry="9" fill="#FF8A3A" opacity=".45"/>'; };
P['flame-outer'] = function () { return '<path d="M60,4 C120,74 135,114 105,174 C90,204 30,204 15,174 C-15,114 5,74 60,4Z" transform="translate(0,0)" fill="#E8612A"/>'; };   // 120x200
P['flame-mid'] = function () { return '<path d="M42,2 C76,42 82,70 64,110 C54,130 24,130 16,110 C2,74 14,40 42,2Z" fill="#F7A23B"/>'; };  // 84x124
P['flame-inner'] = function () { return '<path d="M20,2 C38,24 40,40 30,60 C24,70 12,70 8,60 C2,42 8,28 20,2Z" fill="#FFE07A"/>'; };     // 40x70

// ------------------------------------------------------------------ Starlit Night (the moon is separate: tonight's real phase)
function starlit(season) {
  var s = '<rect class="no" width="450" height="450" fill="' + vg('#0A0F2C', '#3B2F6E') + '"/>';
  DEFS += '<filter id="mwb" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="16"/></filter>';
  s += '<path class="no" d="M-40,60 C120,120 260,170 500,300" stroke="#B9A8FF" stroke-opacity=".2" stroke-width="90" fill="none" filter="url(#mwb)"/>';
  var r = rng(9);
  for (var i = 0; i < 70; i++) s += '<circle class="no" cx="' + f(r() * 450) + '" cy="' + f(r() * 250) + '" r="' + f(.6 + r() * 1.2) + '" fill="#ECE6D8" opacity="' + f(.3 + r() * .6) + '"/>';
  for (i = 0; i < 90; i++) { var t = r(); s += '<circle class="no" cx="' + f(-40 + t * 540 + (r() - .5) * 40) + '" cy="' + f(60 + t * 240 + (r() - .5) * 40) + '" r="' + f(.4 + r() * .5) + '" fill="#E6E4FF" opacity="' + f(.2 + r() * .4) + '"/>'; }
  var far = [[40, 280], [90, 300], [150, 250], [210, 296], [260, 270], [330, 230], [390, 280], [440, 262]];
  s += '<path d="' + peaks(330, far) + '" fill="' + vg('#6A5CB0', '#3A3078') + '"/>';
  if (season === 'winter') far.forEach(function (p, k) {   // snow on the far peaks
    if (k % 2 === 0 && p[1] < 290) s += '<path class="no" d="M' + (p[0] - 14) + ',' + (p[1] + 18) + ' L' + p[0] + ',' + p[1] + ' L' + (p[0] + 14) + ',' + (p[1] + 18) + ' L' + (p[0] + 5) + ',' + (p[1] + 13) + ' L' + p[0] + ',' + (p[1] + 19) + ' L' + (p[0] - 6) + ',' + (p[1] + 13) + 'Z" fill="#E9E6F6"/>';
  });
  s += '<path d="' + peaks(360, [[30, 330], [110, 300], [170, 334], [240, 296], [300, 330], [380, 306], [455, 340]]) + '" fill="' + vg('#3B3478', '#221D52') + '"/>';
  // the lake, the ranges upside down in it, and a mist on the water
  s += '<rect class="no" x="0" y="362" width="450" height="100" fill="' + vg('#2A2766', '#0C0A26') + '"/>';
  s += '<path class="no" d="' + peaks(360, [[30, 330], [110, 300], [170, 334], [240, 296], [300, 330], [380, 306], [455, 340]]) + '" fill="#4B3F8A" opacity=".28" transform="translate(0,724) scale(1,-1)"/>';
  s += '<rect class="no" x="0" y="361" width="450" height="1.5" fill="#AEB8E8" opacity=".4"/>';
  s += '<rect class="no" x="0" y="364" width="450" height="26" fill="' + vg('#B9C2EE', '#B9C2EE') + '" opacity=".1"/>';
  s += '<path d="M-5,460 L-5,400 C60,388 140,384 220,392 C300,398 360,396 455,388 L455,460Z" fill="' + (season === 'winter' ? vg('#3A3A6A', '#22224A') : vg('#1A1648', '#0A0822')) + '"/>';
  // a little cabin with a lit window by the lake shore
  s += '<circle class="no" cx="340" cy="398" r="34" fill="' + rg(340, 398, 34, '#FFC867', .35) + '"/>';
  s += '<path d="M318,392 L340,374 L362,392 L362,410 L318,410Z" fill="#0E0C28"/><rect class="no" x="334" y="394" width="10" height="8" fill="#FFC867"/>';
  return s + grain(.7);
}
function moon(phase, big) {   // northern view, lit on the right while waxing
  var cx = big / 2, cy = big / 2, rr = big / 2 - 2;
  var tw = rr * Math.cos(2 * Math.PI * phase), aw = Math.max(Math.abs(tw), .4);
  var d = 'M' + cx + ',' + (cy - rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + cx + ',' + (cy + rr) + ' A' + f(aw) + ',' + rr + ' 0 0 ' + (tw >= 0 ? 0 : 1) + ' ' + cx + ',' + (cy - rr) + ' Z';
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="#2A2C5E"/><path d="' + d + '" fill="#DAC696"' + (phase > .5 ? ' transform="translate(' + big + ',0) scale(-1,1)"' : '') + '/>';
}
for (var m = 0; m < 8; m++) (function (m) { P['moon' + m] = function () { return moon(m / 8 + .0001, 64); }; })(m);
P['moonglow'] = function () { return '<defs><radialGradient id="h"><stop offset="0" stop-color="#DAC696" stop-opacity=".35"/><stop offset="1" stop-color="#DAC696" stop-opacity="0"/></radialGradient></defs><circle cx="70" cy="70" r="70" fill="url(#h)"/>'; };  // 140
P['shooting'] = function () { return '<defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#FFF" stop-opacity=".95"/></linearGradient></defs><path d="M2,2 L96,30" stroke="url(#s)" stroke-width="2.4" stroke-linecap="round"/>'; };  // 100x34

// ------------------------------------------------------------------ Lothlórien (the lamps and falling leaves move)
var LORIEN = { spring: ['#E8C45A', '#F2D98A', '#C9A23A'], summer: ['#B9C46A', '#D9D08A', '#8FA64E'], autumn: ['#E9B23A', '#F6D06A', '#C98A2A'], winter: ['#E2B85A', '#F0D49A', '#B8913A'] };
function lorien(season) {
  var lf = LORIEN[season], s = '';
  s += '<rect class="no" width="450" height="450" fill="' + vg('#1F2C47', '#E9A860') + '"/>';
  s += '<rect class="no" width="450" height="450" fill="' + rg(225, 330, 300, '#FFE2A0', .55) + '"/>';
  // far woods in the golden haze
  var r = rng(21);
  for (var i = 0; i < 9; i++) { var x = 10 + i * 52 + r() * 20, h = 120 + r() * 50, c = mix(lf[0], '#E9A860', .5);
    s += '<path class="no" d="M' + f(x - 3) + ',360 L' + f(x - 1.5) + ',' + f(360 - h * .7) + ' L' + f(x + 1.5) + ',' + f(360 - h * .7) + ' L' + f(x + 3) + ',360Z" fill="' + mix('#B9A890', '#E9A860', .3) + '" opacity=".6"/>' +
      '<ellipse class="no" cx="' + f(x) + '" cy="' + f(360 - h * .8) + '" rx="' + f(h * .14) + '" ry="' + f(h * .08) + '" fill="' + c + '" opacity=".55"/>'; }
  s += '<rect class="no" x="0" y="300" width="450" height="80" fill="' + vg('#F3C67A', '#F3C67A') + '" opacity=".25"/>';
  // the ground of fallen gold
  s += '<path d="' + wave(372, 6, 0.02, 2) + '" fill="' + vg(mix(lf[0], '#FFFFFF', .1), mix(lf[2], '#3A2A18', .4)) + '"/>';
  r = rng(22);
  for (i = 0; i < 40; i++) s += '<ellipse class="no" cx="' + f(r() * 450) + '" cy="' + f(380 + r() * 70) + '" rx="' + f(3 + r() * 2) + '" ry="1.6" fill="' + lf[i % 3] + '"/>';
  // two great mallorns at the edges, silver columns with a white flet each
  [-1, 1].forEach(function (side) {
    var x = 225 + side * 150, g = 'b' + (gid++);
    DEFS += '<linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DA9AC"/><stop offset=".4" stop-color="#E9EEEC"/><stop offset="1" stop-color="#7E8A8E"/></linearGradient>';
    s += '<path d="M' + (x - 34) + ',470 C' + (x - 18) + ',440 ' + (x - 14) + ',410 ' + (x - 13) + ',380 L' + (x - 10) + ',-10 L' + (x + 10) + ',-10 L' + (x + 13) + ',380 C' + (x + 14) + ',410 ' + (x + 18) + ',440 ' + (x + 34) + ',470Z" fill="url(#' + g + ')"/>';
    s += '<path class="no" d="M' + (x - 34) + ',250 L' + (x + 34) + ',250 L' + (x + 30) + ',255 L' + (x - 30) + ',255Z" fill="#F2EEE2"/>';
    // a golden crown hanging in from the edge
    var cx = x + side * 40, c = 'k' + (gid++);
    DEFS += '<linearGradient id="' + c + '" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="170"><stop offset="0" stop-color="' + mix(lf[1], '#FFFFFF', .25) + '"/><stop offset=".6" stop-color="' + lf[0] + '"/><stop offset="1" stop-color="' + mix(lf[2], '#3A2A18', .35) + '"/></linearGradient>';
    s += '<g fill="url(#' + c + ')"><ellipse cx="' + cx + '" cy="140" rx="70" ry="24"/><ellipse cx="' + (cx - side * 40) + '" cy="124" rx="30" ry="20"/><ellipse cx="' + cx + '" cy="112" rx="34" ry="24"/><ellipse cx="' + (cx + side * 30) + '" cy="120" rx="28" ry="20"/></g>';
  });
  return s + grain(.8);
}
P['lamp'] = function () { return '<defs><radialGradient id="h"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".7"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient></defs><circle cx="16" cy="16" r="16" fill="url(#h)"/><circle cx="16" cy="16" r="3" fill="#FFF0C4"/>'; };  // 32
P['leaf'] = function () { return '<ellipse cx="8" cy="4" rx="7" ry="3.4" fill="#EBB83E"/>'; };  // 16x8

// ------------------------------------------------------------------ The Grey Havens (the ship, the moon and the tower's lamp move)
function havens(season) {
  var s = '<rect class="no" width="450" height="450" fill="' + vg('#0A0F1E', '#5A6A86') + '"/>';
  var r = rng(31);
  for (var i = 0; i < 60; i++) s += '<circle class="no" cx="' + f(r() * 450) + '" cy="' + f(r() * 260) + '" r="' + f(.6 + r() * 1.1) + '" fill="#F2F2EE" opacity="' + f(.3 + r() * .6) + '"/>';
  s += '<path d="' + peaks(330, [[0, 318], [60, 300], [130, 312], [200, 290], [270, 308], [340, 296], [455, 314]]) + '" fill="' + vg('#3E4C6E', '#26304A') + '"/>';
  s += '<rect class="no" x="0" y="300" width="450" height="32" fill="' + vg('#8A9AB8', '#8A9AB8') + '" opacity=".14"/>';
  s += '<rect x="0" y="330" width="450" height="130" fill="' + vg('#6E7E9A', '#0E1528') + '"/>';
  // the moon's road on the water
  r = rng(32);
  for (i = 0; i < 18; i++) { var t = r(), y = 336 + t * 100, w = 6 + (1 - t) * 26; s += '<rect class="no" x="' + f(118 - w / 2 + (r() - .5) * (16 + t * 60)) + '" y="' + f(y) + '" width="' + f(w) + '" height="1.6" fill="#E6ECF8" opacity="' + f(.25 + (1 - t) * .4) + '"/>'; }
  // the headland and its white tower

  s += '<path d="M396,262 L399,200 L413,200 L416,262Z" fill="' + vg('#F2F2EE', '#A9B0C0') + '"/><path d="M398,200 h16 v-6 h-16z" fill="#C9CED8"/><path d="M401,194 h10 v-12 h-10z" fill="#FFF2D0"/><path d="M399,182 L406,172 L413,182Z" fill="#A9B0C0"/>';
  // the quay along the near shore
  s += '<path d="M-5,460 L-5,410 L230,410 L250,426 L250,460Z" fill="' + vg('#7A8298', '#2A3046') + '"/>';
  if (season === 'winter') s += '<path class="no" d="M-5,410 L230,410 l4,3 L-5,413Z" fill="#F2F4FA"/>';
  return s + grain(.6);
